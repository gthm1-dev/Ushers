<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<base target="_top">
<style>
  :root {
    --bg: #f5f7fa; --card: #ffffff; --ink: #1b2430; --muted: #5d6b7c; --line: #dfe5ec;
    --brand: #0b5c8f; --brand-ink: #ffffff; --accent: #e8f2fa; --ok: #1d7a46; --ok-bg: #e5f5ec;
    --warn: #9a5b00; --warn-bg: #fff4e0; --err: #b3261e; --err-bg: #fdecea;
    --conf: #6b3fa0; --conf-bg: #f2ecfa; --spec: #a0471f; --spec-bg: #fcefe8;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #11161c; --card: #1a2129; --ink: #e8edf2; --muted: #9aa8b7; --line: #2c3642;
      --brand: #4fa3d9; --brand-ink: #0b1620; --accent: #1d2c3a; --ok: #6fd39b; --ok-bg: #16301f;
      --warn: #f2b45a; --warn-bg: #33270f; --err: #ff8a80; --err-bg: #3a1a18;
      --conf: #c4a3ee; --conf-bg: #2a2138; --spec: #f2a37f; --spec-bg: #35231a;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  header { background: var(--brand); color: var(--brand-ink); padding: 20px 16px 18px; }
  header .church { font-size: 13px; letter-spacing: .04em; text-transform: uppercase; opacity: .85; }
  header h1 { margin: 2px 0 0; font-size: 22px; }
  header .sub { font-size: 14px; opacity: .9; }
  main { max-width: 640px; margin: 0 auto; padding: 16px 16px 120px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 14px; }
  label { display: block; font-weight: 600; margin: 0 0 6px; }
  input[type=email], input[type=text] { width: 100%; font-size: 17px; padding: 12px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
  .field + .field { margin-top: 12px; }
  .hint { color: var(--muted); font-size: 14px; margin: 6px 0 0; }
  button { font: inherit; cursor: pointer; }
  .btn { display: inline-block; width: 100%; padding: 14px; border: 0; border-radius: 10px;
    background: var(--brand); color: var(--brand-ink); font-weight: 700; font-size: 17px; margin-top: 14px; }
  .btn[disabled] { opacity: .55; cursor: default; }
  .link { background: none; border: 0; color: var(--brand); padding: 0; text-decoration: underline; font-size: 14px; }
  .msg { border-radius: 10px; padding: 12px 14px; margin-bottom: 14px; font-size: 15px; }
  .msg.err { background: var(--err-bg); color: var(--err); }
  .msg.ok { background: var(--ok-bg); color: var(--ok); }
  .msg.warn { background: var(--warn-bg); color: var(--warn); }
  .hidden { display: none !important; }
  .hello { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; margin: 4px 0 12px; }
  .chip { border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 999px;
    padding: 7px 12px; font-size: 14px; }
  .chip[aria-pressed=true] { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); }
  .month { font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted);
    margin: 18px 4px 8px; font-weight: 700; }
  .day { background: var(--card); border: 1px solid var(--line); border-radius: 12px; margin-bottom: 10px; overflow: hidden; }
  .day-head { padding: 10px 14px; background: var(--accent); font-weight: 700; display: flex; justify-content: space-between; gap: 8px; }
  .day-head .event { font-weight: 600; font-size: 13px; text-align: right; }
  .day-head.conference .event { color: var(--conf); }
  .day-head.special .event { color: var(--spec); }
  .svc { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-top: 1px solid var(--line); }
  .svc:first-of-type { border-top: 0; }
  .tag.full { background: var(--line); color: var(--muted); }
  .svc.is-full .what { opacity: .6; }
  .tag.off { background: var(--err-bg); color: var(--err); }
  .svc input { width: 24px; height: 24px; accent-color: var(--brand); flex: none; }
  .svc .what { flex: 1; min-width: 0; }
  .svc .time { font-weight: 600; }
  .svc .meta { color: var(--muted); font-size: 13px; }
  .tag { font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 999px; white-space: nowrap; }
  .tag.on { background: var(--ok-bg); color: var(--ok); }
  .tag.conf { background: var(--conf-bg); color: var(--conf); }
  .tag.spec { background: var(--spec-bg); color: var(--spec); }
  .bar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--card); border-top: 1px solid var(--line);
    padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); }
  .bar .inner { max-width: 640px; margin: 0 auto; }
  .bar .btn { margin-top: 0; }
  .empty { color: var(--muted); text-align: center; padding: 24px 8px; }
  ul.result { margin: 8px 0 0; padding-left: 20px; }
  .spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid currentColor; border-right-color: transparent;
    border-radius: 50%; animation: spin .8s linear infinite; vertical-align: -3px; margin-right: 6px; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body data-code="<?= code ?>">
<header>
  <div class="church">River at Tampa Bay Church</div>
  <h1>River Teams Ushers</h1>
  <div class="sub">Ministry of Helps Department · Self-Scheduling</div>
</header>

<main>
  <div id="msg" class="msg hidden" role="status" aria-live="polite"></div>

  <!-- Step 1: who are you -->
  <form id="signin" class="card" novalidate>
    <div class="field">
      <label for="name">Your name</label>
      <input id="name" type="text" autocomplete="name" required placeholder="First and last name">
    </div>
    <div class="field">
      <label for="email">Your email</label>
      <input id="email" type="email" autocomplete="email" inputmode="email" required placeholder="you@example.com">
      <p class="hint">Use the same email each time so we can show what you're already on.</p>
    </div>
    <div class="field">
      <label for="phone">Mobile phone <span class="hint">(optional)</span></label>
      <input id="phone" type="text" autocomplete="tel" inputmode="tel" placeholder="(813) 555-1234">
    </div>
    <div class="field hidden" id="codeField">
      <label for="code">Team access code</label>
      <input id="code" type="text" autocomplete="off" autocapitalize="off" placeholder="From your team leader">
    </div>
    <button class="btn" id="signinBtn" type="submit">See available services</button>
  </form>

  <!-- Step 2: pick services -->
  <section id="picker" class="hidden">
    <div class="card hello">
      <div><strong id="who"></strong><div class="hint" id="windowText"></div></div>
      <button class="link" id="switchUser" type="button">Not you?</button>
    </div>
    <div class="chips" role="group" aria-label="Filter services">
      <button class="chip" data-filter="all" aria-pressed="true" type="button">All</button>
      <button class="chip" data-filter="sunam" aria-pressed="false" type="button">Sunday AM</button>
      <button class="chip" data-filter="sunpm" aria-pressed="false" type="button">Sunday PM</button>
      <button class="chip" data-filter="wedpm" aria-pressed="false" type="button">Wednesday PM</button>
      <button class="chip" data-filter="events" aria-pressed="false" type="button">Conferences &amp; Special</button>
    </div>
    <div id="list"></div>
  </section>
</main>

<div class="bar hidden" id="bar">
  <div class="inner">
    <button class="btn" id="submitBtn" type="button" disabled>Select services</button>
  </div>
</div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  // services: from the server; want: keys the usher has checked (starts as what they're on)
  const state = { name: '', email: '', phone: '', code: '', services: [], want: new Set(), filter: 'all' };

  const store = {
    get(k) { try { return localStorage.getItem(k) || ''; } catch { return ''; } },
    set(k, v) { try { v ? localStorage.setItem(k, v) : localStorage.removeItem(k); } catch {} },
  };

  // A code in the link (…/exec?code=XYZ) saves ushers from typing it.
  state.code = document.body.dataset.code || store.get('usherCode');
  if (state.code) $('code').value = state.code;
  $('name').value = store.get('usherName');
  $('email').value = store.get('usherEmail');
  $('phone').value = store.get('usherPhone');

  // google.script.run as a promise
  const server = (fn, ...args) => new Promise((resolve, reject) => {
    google.script.run.withSuccessHandler(resolve).withFailureHandler((err) => {
      const msg = String((err && err.message) || err).replace(/^Error:\s*/, '');
      const e = new Error(msg.replace(/^ACCESS_CODE:\s*/, ''));
      e.needsCode = msg.startsWith('ACCESS_CODE');
      reject(e);
    })[fn](...args);
  });

  function show(text, kind = 'err') {
    const m = $('msg');
    if (!text) { m.className = 'msg hidden'; m.innerHTML = ''; return; }
    m.className = `msg ${kind}`;
    m.innerHTML = text;
    m.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const busy = (btn, on, label) => { btn.disabled = on; if (label) btn.innerHTML = on ? `<span class="spinner"></span>${label}` : label; };

  const dateOf = (ymd) => { const [y, m, d] = ymd.split('-').map(Number); return new Date(y, m - 1, d); };
  const fmtDay = (ymd) => dateOf(ymd).toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric' });
  const fmtMonth = (ymd) => dateOf(ymd).toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
  const fmtShort = (s) => `${dateOf(s.date).toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' })} · ${s.session} (${s.time})`;

  function matches(s) {
    switch (state.filter) {
      case 'sunam': return s.kind === 'regular' && s.weekday === 'Sun' && s.session === 'AM';
      case 'sunpm': return s.kind === 'regular' && s.weekday === 'Sun' && s.session === 'PM';
      case 'wedpm': return s.kind === 'regular' && s.weekday === 'Wed';
      case 'events': return s.kind !== 'regular';
      default: return true;
    }
  }

  const changes = () => ({
    add: state.services.filter((s) => !s.scheduled && state.want.has(s.key)).map((s) => s.key),
    remove: state.services.filter((s) => s.scheduled && !state.want.has(s.key)).map((s) => s.key),
  });

  async function load() {
    const data = await server('getServices', state.email, state.code);
    state.services = data.services;
    state.want = new Set(state.services.filter((s) => s.scheduled).map((s) => s.key));
    $('who').textContent = `Hi, ${state.name}`;
    if (state.services.length) {
      const first = state.services[0].date, last = state.services[state.services.length - 1].date;
      $('windowText').textContent = `Services from ${fmtDay(first)} through ${fmtDay(last)}`;
    } else {
      $('windowText').textContent = '';
    }
    $('signin').classList.add('hidden');
    $('picker').classList.remove('hidden');
    $('bar').classList.remove('hidden');
    render();
  }

  function render() {
    const list = $('list');
    const visible = state.services.filter(matches);
    if (!visible.length) { list.innerHTML = '<div class="empty">No services in this view.</div>'; updateBar(); return; }

    let html = '', month = '', day = '';
    for (const s of visible) {
      const m = fmtMonth(s.date);
      if (m !== month) { if (day) html += '</div>'; day = ''; html += `<div class="month">${esc(m)}</div>`; month = m; }
      if (s.date !== day) {
        if (day) html += '</div>';
        const ev = s.kind === 'regular' ? '' : `<span class="event">${esc(s.name)}</span>`;
        html += `<div class="day"><div class="day-head ${s.kind}"><span>${esc(fmtDay(s.date))}</span>${ev}</div>`;
        day = s.date;
      }
      const id = `svc_${s.key}`, checked = state.want.has(s.key);
      const tag = s.scheduled && !checked ? '<span class="tag off">Removing</span>'
        : s.scheduled ? '<span class="tag on">You\'re on</span>'
        : s.kind === 'conference' ? '<span class="tag conf">Conference</span>'
        : s.kind === 'special' ? '<span class="tag spec">Special</span>' : '';
      const label = s.kind === 'regular' ? s.name : `${s.session} session`;
      const isFull = s.needed && s.count >= s.needed && !s.scheduled;
      const count = !s.needed ? (s.count ? ` · ${s.count} usher${s.count === 1 ? '' : 's'} signed up` : '')
        : s.count >= s.needed ? ` · ${s.count} of ${s.needed} ushers · Full`
        : ` · ${s.count} of ${s.needed} ushers · ${s.needed - s.count} more needed`;
      const tagHtml = isFull ? '<span class="tag full">Full</span>' : tag;
      html += `<label class="svc${isFull ? ' is-full' : ''}" for="${id}">
        <input type="checkbox" id="${id}" data-key="${esc(s.key)}" ${checked ? 'checked' : ''} ${isFull ? 'disabled' : ''}>
        <span class="what"><span class="time">${esc(label)}</span><br><span class="meta">${esc(s.time)}${esc(count)}</span></span>
        ${tagHtml}</label>`;
    }
    if (day) html += '</div>';
    list.innerHTML = html;
    updateBar();
  }

  function updateBar() {
    const { add, remove } = changes(), btn = $('submitBtn');
    const parts = [];
    if (add.length) parts.push(`add ${add.length}`);
    if (remove.length) parts.push(`remove ${remove.length}`);
    btn.disabled = !parts.length;
    btn.textContent = !parts.length ? 'Select services'
      : !remove.length ? `Schedule me for ${add.length} service${add.length === 1 ? '' : 's'}`
      : `Save changes (${parts.join(', ')})`;
  }

  $('list').addEventListener('change', (e) => {
    const key = e.target.dataset && e.target.dataset.key;
    if (!key) return;
    e.target.checked ? state.want.add(key) : state.want.delete(key);
    render();
  });

  document.querySelectorAll('.chip').forEach((chip) => chip.addEventListener('click', () => {
    state.filter = chip.dataset.filter;
    document.querySelectorAll('.chip').forEach((c) => c.setAttribute('aria-pressed', c === chip ? 'true' : 'false'));
    render();
  }));

  $('signin').addEventListener('submit', async (e) => {
    e.preventDefault();
    const name = $('name').value.trim(), email = $('email').value.trim();
    if (!name) { show('Please enter your name.'); return; }
    if (!/^\S+@\S+\.\S+$/.test(email)) { show('Please enter a valid email address.'); return; }
    Object.assign(state, { name, email, phone: $('phone').value.trim(), code: $('code').value.trim() || state.code });
    show('');
    const btn = $('signinBtn');
    busy(btn, true, 'Loading services…');
    try {
      await load();
      store.set('usherName', state.name);
      store.set('usherEmail', state.email);
      store.set('usherPhone', state.phone);
      store.set('usherCode', state.code);
    } catch (err) {
      if (err.needsCode) { $('codeField').classList.remove('hidden'); $('code').focus(); }
      show(esc(err.message));
    } finally {
      busy(btn, false, 'See available services');
    }
  });

  $('switchUser').addEventListener('click', () => {
    ['usherName', 'usherEmail', 'usherPhone'].forEach((k) => store.set(k, ''));
    ['name', 'email', 'phone'].forEach((id) => { $(id).value = ''; });
    state.services = []; state.want.clear();
    $('picker').classList.add('hidden'); $('bar').classList.add('hidden');
    $('signin').classList.remove('hidden');
    show('');
    $('name').focus();
  });

  $('submitBtn').addEventListener('click', async () => {
    const { add, remove } = changes();
    const byKey = new Map(state.services.map((s) => [s.key, s]));
    const btn = $('submitBtn');
    busy(btn, true, 'Saving…');
    show('');
    try {
      const res = await server('saveSignup', { name: state.name, email: state.email, phone: state.phone, code: state.code, add, remove });
      const lines = (arr) => arr.map((k) => byKey.get(k)).filter(Boolean).map((s) => `<li>${esc(fmtShort(s))}</li>`).join('');
      let html = '';
      if (res.added.length) html += `<strong>Thank you! You're scheduled for:</strong><ul class="result">${lines(res.added)}</ul>`;
      if (res.removed.length) html += `<div style="margin-top:8px"><strong>Removed:</strong></div><ul class="result">${lines(res.removed)}</ul>`;
      if (res.full.length) html += `<div style="margin-top:8px"><strong>Already full — not added:</strong></div><ul class="result">${lines(res.full)}</ul>`;
      if (res.already.length) html += `<div style="margin-top:8px">Already on the schedule:</div><ul class="result">${lines(res.already)}</ul>`;
      show(html || 'Nothing to change.', 'ok');
      await load(); // refresh "You're on" badges and counts
    } catch (err) {
      show(`${esc(err.message)}<br>Please try again, or contact your team leader.`);
    } finally {
      busy(btn, false);
      updateBar();
    }
  });

  // Returning ushers go straight to the list.
  if ($('name').value && $('email').value) $('signin').requestSubmit();
})();
</script>
</body>
</html>
